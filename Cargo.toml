[package]
name = "skl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Keep agent skills for Claude Code and Codex in sync across machines from a manifest and lockfile"
license = "MIT"
repository = "https://github.com/nanoxd/skl"
readme = "README.md"
keywords = ["skills", "claude-code", "codex", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25.17"

sha2 = "0.10"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
