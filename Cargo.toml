[package]
name = "skl"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Keep agent skills in sync across coding agents and machines from a manifest and lockfile"
license = "MIT"
repository = "https://github.com/nanoxd/skl"
readme = "README.md"
default-run = "skl"
keywords = ["skills", "claude-code", "codex", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[features]
maintainer-tools = []

[[bin]]
name = "prepare_release"
path = "tools/prepare_release.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "update_homebrew"
path = "tools/update_homebrew.rs"
required-features = ["maintainer-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
ureq = { version = "~3.4.2", default-features = false, features = ["rustls"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25.17"

sha2 = "0.10"
tempfile = "3.27.0"
clap_complete = "4.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
