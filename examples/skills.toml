# Save as ~/.config/skl/skills.toml, then run `skl sync`.
# Commit this file and the generated skills.lock to your dotfiles.
# For a team, save it at the project root and run `skl --project . sync`.

# These are also the default agents when this line is omitted.
agents = ["claude-code", "codex"]

[skills]
# Install one skill from a Git repository. skills.lock pins its exact commit.
skill-creator = { source = "anthropics/skills", subdir = "skills/skill-creator" }

# Uncomment and adapt these entries for your own setup:

# A skill in your dotfiles, relative to this manifest's directory.
# Local skills are linked in place; their contents aren't pinned by skills.lock.
# my-skill = { path = "./local/my-skill" }

# Restrict a skill to an agent and a machine profile.
# notes = { source = "your-org/agent-skills", subdir = "skills/notes", agents = ["codex"], profiles = ["work"] }

# Trusted app commands refresh on explicit sync/update. Never run in dry runs.
# cmux = { command = ["cmux", "--skill"], version-command = ["cmux", "--version"], os = ["macos"] }
# orca-cli = { command = ["orca", "skills", "get", "orca-cli"], os = ["macos"] }
# rocketsim = { path = "/Applications/RocketSim.app/Contents/Resources/Agent-Skill/rocketsim", optional = true, os = ["macos"] }
# For an exporter, pass "{output}" as a whole argument naming its destination.
# app = { command = ["my-app", "export-skill", "{output}"], timeout = 60 }

# Skills bundled with Xcode on macOS. Machines without Xcode skip them.
# [sources.xcode]
# app = "xcode"
# skills = "*"

# Declare a source once and select several skills from it.
# [sources.team]
# source = "your-org/agent-skills"
# ref = "main"
# skills = ["review", "testing"]
# profiles = ["work"]

# Track every skill in one folder of a repository, leaving out names you get elsewhere.
# [sources.pstack]
# source = "cursor/plugins"
# subdir = "harness/pstack/claude-code/skills"
# skills = "*"
# exclude = ["teach"]

# A whole Claude Code or Codex plugin, with its agents, commands and hooks.
# [plugins.pstack]
# source = "cursor/plugins"
