name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/skl-$TARGET.tar.gz" -C "target/$TARGET/release" skl
          cd dist
          shasum -a 256 "skl-$TARGET.tar.gz" > "skl-$TARGET.tar.gz.sha256"
          cat "skl-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: skl-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Prepare changelog and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo run --locked --example prepare_release -- "$TAG" "$(date -u +%F)"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build Homebrew formula updater
        run: cargo build --locked --example update_homebrew
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
      - name: Save changelog on the default branch
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "docs: update changelog for $TAG"
          CHANGELOG_COMMIT=$(git rev-parse HEAD)
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B release-changelog FETCH_HEAD
          # A successful earlier run may already have saved this release.
          if git show HEAD:CHANGELOG.md | awk -v version="[${TAG#v}]" '
            /^## / && $2 == version { found = 1 }
            END { exit !found }
          '; then
            exit 0
          fi
          # Apply only the changelog commit, preserving newer branch commits.
          # Conflicts or concurrent pushes fail safely; never force-push.
          git cherry-pick "$CHANGELOG_COMMIT"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: Update Homebrew formula on the default branch
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B release-homebrew FETCH_HEAD
          # Use the helper built from the tag, but edit the latest branch formula.
          # It verifies all archives and skips prereleases and older versions.
          target/debug/examples/update_homebrew "$TAG" dist
          if git diff --quiet -- Formula/skl.rb; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/skl.rb
          git commit -m "build: update Homebrew formula for $TAG"
          # Never overwrite concurrent branch changes; a failed push can be rerun.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
